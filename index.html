```html
<!DOCTYPE html>
<html>
<head>

<title>Santa Tracker</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#status {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;

    color: white;

    background: black;

    padding: 15px;

    font-family: Arial;

    font-size: 18px;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<div id="status">
    🌎 EARTH STARTING...
</div>


<script>

/* =========================================
   SCENE
========================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================================
   CAMERA
========================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.z = 7;


/* =========================================
   RENDERER
========================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================
   LIGHT
========================================= */

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    5,
    5,
    5
);

scene.add(light);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);


/* =========================================
   EARTH
========================================= */

const earth =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color: 0x1687ff
        })

    );

scene.add(earth);


/* =========================================
   EARTH STATUS
========================================= */

document.getElementById(
    "status"
).innerHTML =
    "🌎 EARTH WORKING";


/* =========================================
   SANTA GROUP
========================================= */

const santa =
    new THREE.Group();

scene.add(santa);


/*
   IMPORTANT:

   Earth radius = 2

   Santa is placed at 3,
   so he is in front of Earth.
*/

santa.position.set(
    0,
    0,
    3
);


/* =========================================
   LOAD SANTA
========================================= */

const loader =
    new THREE.GLTFLoader();


loader.load(

    "santa_-_norad_santa_tracker.glb",

    function(gltf) {

        console.log(
            "SANTA LOADED!"
        );


        const model =
            gltf.scene;


        /* ==============================
           GET MODEL SIZE
        ============================== */

        const box =
            new THREE.Box3()
                .setFromObject(
                    model
                );

        const size =
            new THREE.Vector3();

        box.getSize(size);


        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        console.log(
            "Santa size:",
            size
        );


        /* ==============================
           MAKE SANTA SMALLER
        ============================== */

        if (largest > 0) {

            model.scale.setScalar(
                0.6 / largest
            );

        }


        /* ==============================
           CENTER SANTA
        ============================== */

        const centeredBox =
            new THREE.Box3()
                .setFromObject(
                    model
                );

        const center =
            centeredBox.getCenter(
                new THREE.Vector3()
            );

        model.position.sub(
            center
        );


        /* ==============================
           ADD SANTA
        ============================== */

        santa.add(
            model
        );


        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>" +
            "🎅 SANTA WORKING";


    },

    function(xhr) {

        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>" +
            "🎅 LOADING SANTA...";

    },

    function(error) {

        console.error(
            error
        );

        document.getElementById(
            "status"
        ).innerHTML =
            "🌎 EARTH WORKING<br>" +
            "❌ SANTA FAILED";

    }

);


/* =========================================
   ANIMATION
========================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    earth.rotation.y += 0.002;


    if (santa.children.length > 0) {

        santa.rotation.y += 0.01;

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
